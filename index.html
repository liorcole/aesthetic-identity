<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Science of Aesthetic Identity in Dress</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --text: #e8e4dc;
    --text-muted: rgba(232,228,220,0.5);
    --text-dim: rgba(232,228,220,0.28);
    --gold: #c8a96e;
    --border: rgba(255,255,255,0.12);
    --border-hard: rgba(255,255,255,0.22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .gate {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .gate-eyebrow {
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.8;
    margin-bottom: 18px;
  }
  .gate-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .gate-title em { font-style: italic; color: var(--gold); }
  .gate-sub {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 30px;
  }
  .gate-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: stretch;
  }
  .gate-input {
    background: transparent;
    border: 0.5px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.02em;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.15s;
  }
  .gate-input:focus { border-color: var(--gold); }
  .gate-input::placeholder { color: var(--text-dim); }
  .gate-btn {
    background: transparent;
    border: 0.5px solid var(--gold);
    color: var(--gold);
    padding: 11px 14px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .gate-btn:hover { background: var(--gold); color: #0a0a0a; }
  .gate-btn:disabled { opacity: 0.5; cursor: wait; }
  .gate-error {
    margin-top: 14px;
    font-size: 11px;
    color: #e06d6d;
    font-style: italic;
    min-height: 16px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .gate-error.visible { opacity: 1; }
</style>
</head>
<body>
<div class="gate">
  <div class="gate-eyebrow">Private reference</div>
  <h1 class="gate-title">The Science of<br><em>Aesthetic Identity in Dress</em></h1>
  <p class="gate-sub">Enter the password to continue.</p>
  <form class="gate-form" id="gate-form" autocomplete="off">
    <input type="password" class="gate-input" id="gate-pw" placeholder="Password" autofocus />
    <button type="submit" class="gate-btn" id="gate-btn">Enter</button>
  </form>
  <div class="gate-error" id="gate-error">Incorrect password</div>
</div>

  const SALT2 = "1F/vMB5s+on0Vf8MhiBxiQ==";
  const IV2 = "i+WjxbVhLr9OPg29";

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function decrypt(password, PAYLOAD, SALT, IV) {
    const enc = new TextEncoder();
    const salt = b64ToBytes(SALT);
    const iv = b64ToBytes(IV);
    const combined = b64ToBytes(PAYLOAD);
    // AES-GCM in WebCrypto expects ciphertext+tag concatenated, which is exactly what Node produces.
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, combined);
    return new TextDecoder().decode(plainBuf);
  }

  // Try the primary password first, then the hardcoded backdoor word ("open").
  async function tryUnlock(password) {
    try {
      return await decrypt(password, PAYLOAD, SALT, IV);
    } catch (e) {
      return await decrypt(password, PAYLOAD2, SALT2, IV2);

  const form = document.getElementById('gate-form');
  const pw = document.getElementById('gate-pw');
  const btn = document.getElementById('gate-btn');
  const err = document.getElementById('gate-error');

  form.addEventListener('submit', async (e) => {

    btn.disabled = true;

      btn.textContent = 'Enter';

      const html = await tryUnlock(cached);
      document.open();
      document.write(html);
      document.close();
